<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STI — Tutor de Algoritmos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 700px; background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.12); display: flex; flex-direction: column; height: 90vh; }
    .header { background: #1a73e8; color: #fff; padding: 18px 24px; border-radius: 12px 12px 0 0; }
    .header h1 { font-size: 1.2rem; }
    .header p { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: 0.95rem; line-height: 1.5; }
    .msg.aluno { align-self: flex-end; background: #1a73e8; color: #fff; border-bottom-right-radius: 2px; }
    .msg.tutor { align-self: flex-start; background: #f1f3f4; color: #222; border-bottom-left-radius: 2px; }
    .msg.erro { align-self: flex-start; background: #fdecea; color: #c62828; }
    .msg.carregando { align-self: flex-start; background: #f1f3f4; color: #888; font-style: italic; }
    .input-area { padding: 16px; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; }
    .input-area input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 24px; font-size: 0.95rem; outline: none; }
    .input-area input:focus { border-color: #1a73e8; }
    .input-area button { background: #1a73e8; color: #fff; border: none; border-radius: 24px; padding: 10px 22px; font-size: 0.95rem; cursor: pointer; }
    .input-area button:hover { background: #1558b0; }
    .input-area button:disabled { background: #aaa; cursor: not-allowed; }
    .aluno-info { padding: 8px 24px; background: #e8f0fe; font-size: 0.82rem; color: #1a73e8; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>STI — Tutor de Algoritmos</h1>
    <p>Grupo 1 — Backend em teste</p>
  </div>
  <div class="aluno-info">
    Aluno: <strong id="nome-aluno">aluno001</strong>
  </div>
  <div class="messages" id="messages">
    <div class="msg tutor">Olá! Sou seu tutor de Algoritmos e Programação. Como posso te ajudar hoje?</div>
  </div>
  <div class="input-area">
    <input type="text" id="pergunta" placeholder="Digite sua pergunta..." autocomplete="off" />
    <button id="btn-enviar" onclick="enviar()">Enviar</button>
  </div>
</div>

<script>
  const ALUNO_ID = "aluno001";
  const msgs = document.getElementById("messages");
  const input = document.getElementById("pergunta");
  const btn   = document.getElementById("btn-enviar");

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") enviar();
  });

  function addMsg(texto, tipo) {
    const div = document.createElement("div");
    div.className = "msg " + tipo;
    div.textContent = texto;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  async function enviar() {
    const pergunta = input.value.trim();
    if (!pergunta) return;

    input.value = "";
    btn.disabled = true;
    addMsg(pergunta, "aluno");
    const loading = addMsg("Digitando...", "carregando");

    try {
      const res = await fetch("/api/perguntar/", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
        body: JSON.stringify({ pergunta, aluno_id: ALUNO_ID }),
      });
      const data = await res.json();
      loading.remove();
      if (data.resposta) {
        addMsg(data.resposta, "tutor");
        if (data.fontes && data.fontes.length > 0) {
          addMsg("Fontes consultadas: " + data.fontes.length + " trecho(s) do material.", "tutor");
        }
      } else if (data.erro) {
        addMsg("Erro: " + data.erro, "erro");
      }
    } catch (err) {
      loading.remove();
      addMsg("Erro de conexão com o servidor.", "erro");
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }

  function getCookie(name) {
    const v = document.cookie.match("(^|;) ?" + name + "=([^;]*)(;|$)");
    return v ? v[2] : "";
  }
</script>
</body>
</html>
